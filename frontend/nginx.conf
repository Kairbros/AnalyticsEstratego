server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Cache largo para assets con hash en el nombre
  location ~* \.(?:js|css|woff2?|ttf|otf|eot|svg|png|jpg|jpeg|webp|gif|ico)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA fallback: cualquier ruta no encontrada cae en index.html para que
  # React Router resuelva client-side.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
